[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible-shared"
version = "0.1.0"
description = "Shared utilities for the Crucible AI Agents platform (logger, config helpers, etc.)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
